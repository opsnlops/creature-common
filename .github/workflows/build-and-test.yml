name: Build and Test

on: [push, pull_request]

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Publishing goes through avahi-daemon, so AvahiPublisher.cpp only
      # compiles on Linux. These runners are the only place it gets compiled
      # at all — a macOS dev build leaves it out entirely.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavahi-client-dev \
            ninja-build \
            pkgconf

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} .

      - name: Build
        run: cmake --build build

      # A green build is not enough on its own. If the Linux guard in
      # CMakeLists.txt ever stops matching, the publisher silently drops out of
      # the library and everything still passes — so check the symbol is really
      # in there rather than trusting the exit code.
      - name: Check the Avahi publisher compiled in
        if: runner.os == 'Linux'
        run: |
          if ! nm --defined-only build/libcreature_mdns.a | grep -q makeAvahiTxt; then
            echo "::error::makeAvahiTxt is missing from libcreature_mdns.a — AvahiPublisher.cpp was not compiled on a Linux build"
            exit 1
          fi
          echo "AvahiPublisher.cpp is compiled into libcreature_mdns.a"

      - name: Test
        run: ctest --test-dir build --output-on-failure
